name: Update Fantacalcio formations

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  update-formations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update formations snapshot
        run: python scripts/update_formations_fantacalcio.py

      - name: Commit updated formations
        run: |
          if git diff --quiet -- data/seriea_formations.json; then
            echo "No formation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seriea_formations.json
          git commit -m "Update Serie A formations"
          git push
